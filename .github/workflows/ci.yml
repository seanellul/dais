# Continuous integration for Dais.
#
# lint+typecheck -> unit (with coverage) -> integration (PGlite, then
# postgres:16) -> build -> e2e (Playwright, Chromium) -> docker. A gitleaks
# scan runs alongside on every push and pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # The unit and integration suites never talk to a real deployment.
  SESSION_SECRET: ci-session-secret-not-for-production
  CRON_SECRET: ci-cron-secret
  APP_URL: http://localhost:3000
  DEMO_ENABLED: "1"
  LOG_LEVEL: warn

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests with coverage
        run: pnpm exec vitest run --project unit --coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  integration:
    name: Integration tests
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dais
          POSTGRES_PASSWORD: dais
          POSTGRES_DB: dais_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dais -d dais_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check for integration tests
        id: detect
        run: |
          if find tests/integration -name '*.test.ts' 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No integration tests yet; skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Integration suite on PGlite
        if: steps.detect.outputs.present == 'true'
        run: pnpm test:integration
        env:
          PGLITE_DIR: memory://
      - name: Integration suite on postgres:16
        if: steps.detect.outputs.present == 'true'
        run: pnpm test:integration
        env:
          DATABASE_URL_TEST: postgres://dais:dais@localhost:5432/dais_test

  build:
    name: Build
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The judge app's service worker is generated into public/ at build time
      # and is gitignored, so it travels with .next/ or the e2e job serves a 404
      # for /sw.js. With more than one search path the artifact root is the
      # repository root; the e2e job downloads it to "." for that reason.
      - name: Upload build output for the e2e job
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: |
            .next/
            !.next/cache/**
            !.next/standalone/**
            public/j/sw.js
            public/j/sw.js.map
            public/j/swe-worker-*.js
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: End-to-end tests
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dais
          POSTGRES_PASSWORD: dais
          POSTGRES_DB: dais_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dais -d dais_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://dais:dais@localhost:5432/dais_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check for e2e tests
        id: detect
        run: |
          if find tests/e2e \( -name '*.spec.ts' -o -name '*.test.ts' \) 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No e2e tests yet; skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download build output
        if: steps.detect.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          name: next-build
          # Restores .next/ and generated public/j/sw* files in place.
          path: .
      - name: Install Chromium
        if: steps.detect.outputs.present == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Migrate isolated browser-test database
        if: steps.detect.outputs.present == 'true'
        run: pnpm db:migrate
      - name: Create private fictional judge fixture
        if: steps.detect.outputs.present == 'true'
        run: pnpm exec tsx scripts/load-judge.ts --setup
        env:
          DAIS_LOAD_SETUP: "1"
          DAIS_LOAD_FIXTURE: data/ci-load-fixture.json
      - name: Run Playwright
        if: steps.detect.outputs.present == 'true'
        run: pnpm e2e
        env:
          CI: "true"
          E2E_JUDGE_FIXTURE: data/ci-load-fixture.json
      - name: Upload Playwright report
        if: failure() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dais:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the image and check /api/health
        run: |
          docker run -d --name dais-ci -p 3000:3000 \
            -e SESSION_SECRET="$SESSION_SECRET" \
            -e APP_URL=http://localhost:3000 \
            dais:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "Healthy after ${attempt} attempts."
              docker rm -f dais-ci
              exit 0
            fi
            sleep 2
          done
          echo "The container never became healthy. Logs:"
          docker logs dais-ci
          docker rm -f dais-ci
          exit 1
      # The compose override must boot against a plain Postgres (no TLS) and
      # answer /api/health/db, which runs a query through the app's own pool.
      - name: Boot docker compose with Postgres and check /api/health/db
        run: |
          docker tag dais:ci dais:local
          compose="docker compose -f docker-compose.yml -f docker/compose.postgres.yml"
          $compose up -d --no-build
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:3000/api/health/db >/dev/null 2>&1; then
              echo "Database healthy after ${attempt} attempts."
              $compose down -v
              exit 0
            fi
            sleep 2
          done
          echo "The app never reached Postgres. Logs:"
          $compose logs
          $compose down -v
          exit 1

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed for organisation-owned repositories.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
